<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ファイルハッシュ値計算ツール</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background-color: #f4f4f4; }
    .hash { font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>

  <h2>ファイルハッシュ値（SHA-256）リスト作成</h2>
  <input type="file" id="fileInput" multiple>

  <table id="resultTable">
    <thead>
      <tr>
        <th>ファイル名</th>
        <th>サイズ</th>
        <th>SHA-256 ハッシュ値</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const files = event.target.files;
      const tbody = document.querySelector('#resultTable tbody');
      tbody.innerHTML = '';

      for (const file of files) {
        const row = document.createElement('tr');
        
        // ファイル名とサイズの表示
        const nameCell = document.createElement('td');
        nameCell.textContent = file.name;
        
        const sizeCell = document.createElement('td');
        sizeCell.textContent = `${(file.size / 1024).toFixed(2)} KB`;

        const hashCell = document.createElement('td');
        hashCell.className = 'hash';
        hashCell.textContent = '計算中...';

        row.appendChild(nameCell);
        row.appendChild(sizeCell);
        row.appendChild(hashCell);
        tbody.appendChild(row);

        // ハッシュ値の計算 (Web Crypto API)
        try {
          const arrayBuffer = await file.arrayBuffer();
          const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          
          hashCell.textContent = hashHex;
        } catch (error) {
          hashCell.textContent = 'エラーが発生しました';
        }
      }
    });
  </script>

</body>
</html>
