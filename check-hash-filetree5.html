<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>making hash-filetree v5</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; margin-right: 8px; }
    textarea { width: 100%; height: 400px; font-family: monospace; font-size: 13px; margin-top: 15px; }
    .controls { margin-bottom: 10px; }
    #status { font-weight: bold; margin-left: 10px; color: #0056b3; }
  </style>
  <!-- CryptoJS の読み込み（大容量ファイルのストリーミング計算用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

  <h2>making hash-filetree v5</h2>
  <h2>BigFile:OK CDKver.</h2>
  <div class="controls">
    <button id="selectDirBtn">フォルダを選択</button>
    <button id="copyBtn" disabled>テキストをコピー</button>
    <button id="downloadBtn" disabled>ファイル保存 (.txt)</button>
    <span id="status"></span>
  </div>

  <textarea id="output" readonly placeholder="フォルダを選択すると、ここにツリー構造とハッシュ値が出力されます..."></textarea>

  <script>
    const selectDirBtn = document.getElementById('selectDirBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const outputTextarea = document.getElementById('output');
    const statusText = document.getElementById('status');

    // 大容量ファイル対応：ストリーミングハッシュ計算（64MBごとに分解処理）
    async function computeSHA256Stream(file, onProgress) {
      const CHUNK_SIZE = 64 * 1024 * 1024; // 64MB 単位で分割
      const algo = CryptoJS.algo.SHA256.create();
      let offset = 0;

      while (offset < file.size) {
        const slice = file.slice(offset, offset + CHUNK_SIZE);
        const buffer = await slice.arrayBuffer();
        const wordBuffer = CryptoJS.lib.WordArray.create(buffer);
        algo.update(wordBuffer);

        offset += CHUNK_SIZE;
        const progress = Math.min(100, Math.round((offset / file.size) * 100));
        if (onProgress) onProgress(progress);

        // UIフリーズ防止のための短いウェイト
        await new Promise(r => setTimeout(r, 1));
      }

      const hash = algo.finalize();
      return hash.toString(CryptoJS.enc.Hex);
    }

    // フォルダ再帰処理関数
    async function processDirectory(dirHandle, indent = '') {
      let lines = [];
      const entries = [];

      for await (const entry of dirHandle.values()) {
        entries.push(entry);
      }

      entries.sort((a, b) => {
        if (a.kind === b.kind) return a.name.localeCompare(b.name);
        return a.kind === 'directory' ? -1 : 1;
      });

      for (let i = 0; i < entries.length; i++) {
        const entry = entries[i];
        const isLast = (i === entries.length - 1);
        const prefix = isLast ? '└── ' : '├── ';
        const childIndent = indent + (isLast ? '    ' : '│   ');

        if (entry.kind === 'file') {
          try {
            const file = await entry.getFile();
            const sizeGB = (file.size / (1024 * 1024 * 1024)).toFixed(2);
            const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
            const sizeStr = file.size > 1024 * 1024 * 1024 ? `${sizeGB} GB` : `${sizeMB} MB`;

            statusText.textContent = `計算中 (0% - ${sizeStr}): ${file.name}`;

            const hash = await computeSHA256Stream(file, (percent) => {
              statusText.textContent = `計算中 (${percent}% - ${sizeStr}): ${file.name}`;
            });

            lines.push(`${indent}${prefix}${entry.name} [SHA-256: ${hash}]`);
          } catch (err) {
            lines.push(`${indent}${prefix}${entry.name} [エラー: ${err.message || '読み込み失敗'}]`);
          }
        } else if (entry.kind === 'directory') {
          lines.push(`${indent}${prefix}${entry.name}/`);
          const subLines = await processDirectory(entry, childIndent);
          lines = lines.concat(subLines);
        }
      }
      return lines;
    }

    selectDirBtn.addEventListener('click', async () => {
      try {
        const dirHandle = await window.showDirectoryPicker();
        statusText.textContent = '計算準備中...';
        outputTextarea.value = '';

        const treeLines = await processDirectory(dirHandle);
        const resultText = `${dirHandle.name}/\n` + treeLines.join('\n');

        outputTextarea.value = resultText;
        statusText.textContent = '完了!';
        aleart('Finish making hush-filetree');
        copyBtn.disabled = false;
        downloadBtn.disabled = false;

      } catch (err) {
        if (err.name !== 'AbortError') {
          alert('エラーが発生しました: ' + err.message);
          statusText.textContent = 'エラー';
        } else {
          statusText.textContent = '';
        }
      }
    });

    copyBtn.addEventListener('click', () => {
      outputTextarea.select();
      navigator.clipboard.writeText(outputTextarea.value);
      alert('クリップボードにコピーしました。');
    });

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([outputTextarea.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'folder_hash_tree.txt';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
